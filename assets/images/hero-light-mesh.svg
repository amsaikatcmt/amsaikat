<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 700" fill="none">
  <!-- Subtle Architectural Connecting Grid Lines -->
  <g stroke="#CBD5E1" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.45">
    <line x1="140" y1="320" x2="660" y2="70" />
    <line x1="660" y1="70" x2="1280" y2="320" />
    <line x1="140" y1="320" x2="680" y2="490" />
    <line x1="680" y1="490" x2="1280" y2="320" />
    <line x1="660" y1="70" x2="680" y2="490" />
  </g>

  <!-- Animated Security Data Packets Flowing Along Backbone Paths -->
  <g opacity="0.75">
    <!-- Packet 1: Primary DC to Transit VPC -->
    <circle r="3.5" fill="#2563EB">
      <animateMotion path="M 140 320 L 660 70" dur="5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="5s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 2: Transit VPC to Secondary DC -->
    <circle r="3.5" fill="#0284C7">
      <animateMotion path="M 660 70 L 1280 320" dur="5.5s" begin="1.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="5.5s" begin="1.5s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 3: Primary DC to NGFW Core -->
    <circle r="3.5" fill="#059669">
      <animateMotion path="M 140 320 L 680 490" dur="6s" begin="0.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="6s" begin="0.8s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 4: NGFW Core to Secondary DC -->
    <circle r="3.5" fill="#3B82F6">
      <animateMotion path="M 680 490 L 1280 320" dur="5.2s" begin="2.2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.9;0.9;0" dur="5.2s" begin="2.2s" repeatCount="indefinite" />
    </circle>
    <!-- Packet 5: Transit VPC to NGFW Core -->
    <circle r="3.5" fill="#7C3AED">
      <animateMotion path="M 660 70 L 680 490" dur="4.5s" begin="2.8s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0;0.85;0.85;0" dur="4.5s" begin="2.8s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Node: PRIMARY DC -->
  <g transform="translate(10, 280)" opacity="0.45">
    <rect width="130" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="65" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">PRIMARY DC</text>
    <text x="65" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#CBD5E1" text-anchor="middle">ACI SPINE/LEAF</text>
  </g>

  <!-- Top Center Node: TRANSIT VPC -->
  <g transform="translate(600, 36)" opacity="0.45">
    <rect width="130" height="52" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="65" y="31" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">TRANSIT VPC</text>
  </g>

  <!-- Center-Bottom Node: NGFW CORE -->
  <g transform="translate(610, 435)" opacity="0.5">
    <rect width="140" height="110" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <!-- Subtle Shield Checkmark Emblem -->
    <path d="M70 24 L48 34 V52 C48 68 58 79 70 84 C82 79 92 68 92 52 V34 L70 24 Z" fill="#EFF6FF" stroke="#3B82F6" stroke-width="1.5" opacity="0.8">
      <animate attributeName="stroke" values="#3B82F6;#2563EB;#38BDF8;#3B82F6" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M62 52 L67 58 L79 44" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="70" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">NGFW CORE</text>
  </g>

  <!-- Right Node: SECONDARY DC -->
  <g transform="translate(1260, 280)" opacity="0.45">
    <rect width="130" height="74" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="65" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" fill="#94A3B8" letter-spacing="1.5" text-anchor="middle">SECONDARY DC</text>
    <text x="65" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#CBD5E1" text-anchor="middle">ACTIVE STANDBY</text>
  </g>
</svg>