<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <linearGradient id="dcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="rackGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#dcBg)" />

  <!-- Floor Grid -->
  <g stroke="#1E293B" stroke-width="1">
    <line x1="400" y1="250" x2="0" y2="500" />
    <line x1="400" y1="250" x2="200" y2="500" />
    <line x1="400" y1="250" x2="400" y2="500" />
    <line x1="400" y1="250" x2="600" y2="500" />
    <line x1="400" y1="250" x2="800" y2="500" />
    <line x1="280" y1="320" x2="520" y2="320" />
    <line x1="180" y1="390" x2="620" y2="390" />
    <line x1="80" y1="460" x2="720" y2="460" />
  </g>

  <!-- Server Rack Left -->
  <g transform="translate(100, 120)">
    <rect width="180" height="340" rx="8" fill="#1E2229" stroke="#334155" stroke-width="2" />
    <!-- Rack Units -->
    <g fill="#0F172A" stroke="#2563EB" stroke-width="0.8">
      <rect x="10" y="20" width="160" height="32" rx="4" />
      <rect x="10" y="60" width="160" height="32" rx="4" />
      <rect x="10" y="100" width="160" height="32" rx="4" />
      <rect x="10" y="140" width="160" height="32" rx="4" />
      <rect x="10" y="180" width="160" height="32" rx="4" />
      <rect x="10" y="220" width="160" height="32" rx="4" />
      <rect x="10" y="260" width="160" height="32" rx="4" />
      <rect x="10" y="300" width="160" height="26" rx="4" />
    </g>
    <!-- Blinking Activity LEDs -->
    <circle cx="25" cy="36" r="3" fill="#10B981" />
    <circle cx="35" cy="36" r="3" fill="#10B981" />
    <circle cx="45" cy="36" r="3" fill="#38BDF8" />
    <circle cx="25" cy="76" r="3" fill="#10B981" />
    <circle cx="35" cy="76" r="3" fill="#38BDF8" />
    <circle cx="25" cy="116" r="3" fill="#10B981" />
    <circle cx="35" cy="116" r="3" fill="#10B981" />
    <text x="70" y="40" font-family="monospace" font-size="9" fill="#94A3B8">PALO ALTO PA-5450</text>
    <text x="70" y="80" font-family="monospace" font-size="9" fill="#94A3B8">FORTIGATE 3000F</text>
    <text x="70" y="120" font-family="monospace" font-size="9" fill="#94A3B8">CISCO NEXUS 9300</text>
  </g>

  <!-- Server Rack Right -->
  <g transform="translate(520, 120)">
    <rect width="180" height="340" rx="8" fill="#1E2229" stroke="#334155" stroke-width="2" />
    <!-- Rack Units -->
    <g fill="#0F172A" stroke="#2563EB" stroke-width="0.8">
      <rect x="10" y="20" width="160" height="32" rx="4" />
      <rect x="10" y="60" width="160" height="32" rx="4" />
      <rect x="10" y="100" width="160" height="32" rx="4" />
      <rect x="10" y="140" width="160" height="32" rx="4" />
      <rect x="10" y="180" width="160" height="32" rx="4" />
      <rect x="10" y="220" width="160" height="32" rx="4" />
      <rect x="10" y="260" width="160" height="32" rx="4" />
      <rect x="10" y="300" width="160" height="26" rx="4" />
    </g>
    <circle cx="25" cy="36" r="3" fill="#10B981" />
    <circle cx="35" cy="36" r="3" fill="#38BDF8" />
    <circle cx="25" cy="76" r="3" fill="#10B981" />
    <circle cx="35" cy="76" r="3" fill="#10B981" />
    <text x="70" y="40" font-family="monospace" font-size="9" fill="#94A3B8">F5 BIG-IP i10800</text>
    <text x="70" y="80" font-family="monospace" font-size="9" fill="#94A3B8">CHECK POINT 28000</text>
    <text x="70" y="120" font-family="monospace" font-size="9" fill="#94A3B8">CISCO ACI SPINE</text>
  </g>

  <!-- Title Overlay -->
  <g transform="translate(250, 40)">
    <rect width="300" height="42" rx="8" fill="#0A1128" stroke="#2563EB" stroke-width="1.2" />
    <text x="150" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" text-anchor="middle">TIER-IV DATA CENTER INFRASTRUCTURE</text>
  </g>
</svg>

