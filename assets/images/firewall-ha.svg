<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="fBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0A1128" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#fBg)" />

  <!-- Firewall Node A (Active) -->
  <g transform="translate(100, 160)">
    <rect width="250" height="180" rx="16" fill="#1E293B" stroke="#10B981" stroke-width="2.5" />
    <rect x="20" y="20" width="100" height="28" rx="6" fill="#10B981" fill-opacity="0.2" />
    <text x="70" y="38" font-family="monospace" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">ACTIVE</text>
    <text x="25" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">NGFW Unit 1 (Primary)</text>
    <text x="25" y="105" font-family="monospace" font-size="11" fill="#94A3B8">IP: 192.168.10.1 (Priority 100)</text>
    <text x="25" y="125" font-family="monospace" font-size="11" fill="#94A3B8">Session Sync: ESTABLISHED</text>
    <text x="25" y="145" font-family="monospace" font-size="11" fill="#38BDF8">Traffic Load: 42.8 Gbps</text>
  </g>

  <!-- Firewall Node B (Standby) -->
  <g transform="translate(450, 160)">
    <rect width="250" height="180" rx="16" fill="#1E293B" stroke="#2563EB" stroke-width="2.5" />
    <rect x="20" y="20" width="100" height="28" rx="6" fill="#2563EB" fill-opacity="0.2" />
    <text x="70" y="38" font-family="monospace" font-size="12" font-weight="700" fill="#38BDF8" text-anchor="middle">STANDBY</text>
    <text x="25" y="80" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">NGFW Unit 2 (Secondary)</text>
    <text x="25" y="105" font-family="monospace" font-size="11" fill="#94A3B8">IP: 192.168.10.2 (Priority 90)</text>
    <text x="25" y="125" font-family="monospace" font-size="11" fill="#94A3B8">State Sync: IN SYNCHRONY</text>
    <text x="25" y="145" font-family="monospace" font-size="11" fill="#10B981">Heartbeat: OK (&lt; 1ms)</text>
  </g>

  <!-- High-Speed Sync Links (HA1 Control / HA2 Data) -->
  <g stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 4">
    <line x1="350" y1="210" x2="450" y2="210" />
    <line x1="350" y1="290" x2="450" y2="290" />
  </g>
  <text x="400" y="200" font-family="monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">HA1 CONTROL</text>
  <text x="400" y="280" font-family="monospace" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">HA2 DATA SYNC</text>

  <!-- Sub-Zero Failover Badge -->
  <g transform="translate(250, 390)">
    <rect width="300" height="46" rx="12" fill="#0A1128" stroke="#334155" stroke-width="1.5" />
    <circle cx="28" cy="23" r="6" fill="#10B981" />
    <text x="44" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">Stateful Failover: &lt; 200 Milliseconds</text>
  </g>
</svg>

