    <rect x="0" y="40" width="100" height="120" rx="10" fill="#0A1128" stroke="#38BDF8" stroke-width="1.8" />
    <text x="50" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">VERIFY</text>
    <text x="50" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">EXPLICITLY</text>
    <text x="50" y="130" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">MFA &amp; Device</text>

    <rect x="150" y="40" width="100" height="120" rx="10" fill="#0A1128" stroke="#10B981" stroke-width="1.8" />
    <text x="200" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">LEAST</text>
    <text x="200" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">PRIVILEGE</text>
    <text x="200" y="130" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Just-in-Time</text>

