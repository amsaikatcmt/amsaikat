    <text x="350" y="100" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F59E0B" text-anchor="middle">BREACH</text>
    <text x="350" y="130" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Microsegment</text>
  </g>

  <g transform="translate(40, 40)">
