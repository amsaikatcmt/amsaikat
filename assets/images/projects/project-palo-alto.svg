    <text x="90" y="32" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#10B981" text-anchor="middle">PA-5400 CLUSTER 02</text>
    <text x="90" y="58" font-family="monospace" font-size="10" fill="#F1F5F9" text-anchor="middle">Stateful Session Replica</text>
    <text x="90" y="80" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">Sub-second Failover</text>
