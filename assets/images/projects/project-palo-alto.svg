    <text x="90" y="80" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">User-ID via Active Directory</text>
    <text x="90" y="102" font-family="monospace" font-size="10" fill="#38BDF8" text-anchor="middle">SSL Forward Proxy</text>
  </g>

