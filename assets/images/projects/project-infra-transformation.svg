<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="transBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0A1128" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#transBg)" />

  <g transform="translate(40, 35)">
    <rect width="380" height="34" rx="8" fill="#0A1128" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">CASE STUDY: NETWORK INFRASTRUCTURE TRANSFORMATION</text>
  </g>

  <!-- Legacy Silos Left -->
  <g transform="translate(50, 110)">
    <rect width="190" height="120" rx="10" fill="#0F172A" stroke="#EF4444" stroke-width="1.8" />
    <text x="95" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F87171" text-anchor="middle">LEGACY STATIC FABRIC</text>
    <text x="95" y="58" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">Manual CLI Provisioning</text>
    <text x="95" y="78" font-family="monospace" font-size="9" fill="#94A3B8" text-anchor="middle">VLAN Sprawl &amp; Latency</text>
    <text x="95" y="98" font-family="monospace" font-size="9" fill="#EF4444" text-anchor="middle">Weeks to Provision Cluster</text>
  </g>

  <!-- Transformation Arrow -->
  <g transform="translate(260, 160)">
    <line x1="0" y1="10" x2="60" y2="10" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <polygon points="60,0 80,10 60,20" fill="#38BDF8" />
    <text x="40" y="-8" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#38BDF8" text-anchor="middle">AUTOMATION</text>
  </g>

  <!-- Modern SDDC Right -->
  <g transform="translate(360, 110)">
    <rect width="190" height="120" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="2" />
    <text x="95" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle">MODERN CISCO ACI SDDC</text>
    <text x="95" y="58" font-family="monospace" font-size="9" fill="#CBD5E1" text-anchor="middle">Policy-Driven Automation</text>
    <text x="95" y="78" font-family="monospace" font-size="9" fill="#CBD5E1" text-anchor="middle">APIC Controller Orchestration</text>
    <text x="95" y="98" font-family="monospace" font-size="9" fill="#10B981" text-anchor="middle">Provisioning in &lt; 30 Mins</text>
  </g>

  <!-- Bottom Overview Box -->
  <g transform="translate(50, 260)">
    <rect width="500" height="90" rx="10" fill="#0A1128" stroke="#6366F1" stroke-width="1.5" />
    <text x="250" y="30" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#818CF8" text-anchor="middle">ZERO-DOWNTIME ENTERPRISE-WIDE INFRASTRUCTURE TRANSFORMATION</text>
    <text x="250" y="54" font-family="monospace" font-size="10" fill="#CBD5E1" text-anchor="middle">Seamless migration of thousands of critical banking workloads</text>
    <text x="250" y="74" font-family="monospace" font-size="10" fill="#10B981" text-anchor="middle">Hardware-assisted security contracts • 99.999% SLA across multi-tier DCs</text>
  </g>
