<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <defs>
    <radialGradient id="p1Bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>
  <rect width="600" height="400" fill="url(#p1Bg)" />

  <!-- Legacy Firewall Left -->
  <g transform="translate(60, 140)">
    <rect width="180" height="120" rx="12" fill="#1E2229" stroke="#EF4444" stroke-width="2" />
    <text x="90" y="45" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#EF4444" text-anchor="middle">LEGACY FIREWALL</text>
    <text x="90" y="70" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">5,000+ Unmanaged Rules</text>
    <text x="90" y="90" font-family="monospace" font-size="10" fill="#EF4444" text-anchor="middle">Performance Bottleneck</text>
  </g>

  <!-- Migration Arrow -->
  <g transform="translate(260, 180)">
    <line x1="0" y1="20" x2="60" y2="20" stroke="#38BDF8" stroke-width="4" stroke-linecap="round" />
    <polygon points="60,10 80,20 60,30" fill="#38BDF8" />
    <text x="40" y="0" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38BDF8" text-anchor="middle">ZERO DOWNTIME</text>
  </g>

  <!-- Next-Gen Palo Alto Firewall Right -->
  <g transform="translate(360, 140)">
    <rect width="180" height="120" rx="12" fill="#0A1128" stroke="#10B981" stroke-width="2.5" />
    <text x="90" y="45" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#10B981" text-anchor="middle">PALO ALTO PA-5450</text>
    <text x="90" y="70" font-family="monospace" font-size="10" fill="#94A3B8" text-anchor="middle">App-ID &amp; User-ID Enabled</text>
    <text x="90" y="90" font-family="monospace" font-size="10" fill="#10B981" text-anchor="middle">99.999% SLA Maintained</text>
  </g>

  <!-- Title Badge -->
  <g transform="translate(40, 40)">
    <rect width="320" height="34" rx="8" fill="#0A1128" stroke="#334155" stroke-width="1.2" />
    <text x="16" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8FAFC">CASE STUDY: FIREWALL MIGRATION</text>
  </g>
</svg>

