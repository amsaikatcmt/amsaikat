<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <defs>
    <radialGradient id="trBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#trBg)" />

  <!-- Virtual Network Simulation Topologies & Terminal Screen -->
  <g transform="translate(80, 80)">
    <!-- Terminal Window -->
    <rect width="640" height="340" rx="14" fill="#0A1128" stroke="#334155" stroke-width="2" />
    <!-- Header -->
    <rect width="640" height="36" rx="14" fill="#1E293B" />
    <circle cx="20" cy="18" r="5" fill="#EF4444" />
    <circle cx="36" cy="18" r="5" fill="#F59E0B" />
    <circle cx="52" cy="18" r="5" fill="#10B981" />
    <text x="320" y="23" font-family="monospace" font-size="11" fill="#94A3B8" text-anchor="middle">munem-firewall-lab@eve-ng: /opt/topologies/palo-alto-ha</text>

    <!-- Lab Console Content -->
    <text x="30" y="75" font-family="monospace" font-size="12" fill="#10B981">&gt; set deviceconfig system ip-address 10.0.0.1 netmask 255.255.255.0</text>
    <text x="30" y="105" font-family="monospace" font-size="12" fill="#38BDF8">&gt; commit description "Configure HA-Pair and GlobalProtect Portal"</text>
    <text x="30" y="135" font-family="monospace" font-size="12" fill="#F8FAFC">Commit job 42 succeeded. State synchronization: VALIDATED.</text>
    <text x="30" y="165" font-family="monospace" font-size="12" fill="#94A3B8">[+] Validating BGP Peering with Autonomous System 65001...</text>
    <text x="30" y="195" font-family="monospace" font-size="12" fill="#10B981">[+] Neighbor 10.0.0.254 state is ESTABLISHED (Up: 4d 12h)</text>
    <text x="30" y="225" font-family="monospace" font-size="12" fill="#38BDF8">[+] Zero Trust Microsegmentation policy active on zone Trust-DMZ</text>

    <!-- Live Lab Diagram Inside Terminal -->
    <g transform="translate(30, 250)">
      <rect width="580" height="60" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1" />
      <circle cx="40" cy="30" r="14" fill="#2563EB" />
      <text x="40" y="34" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">FW1</text>
      <line x1="54" y1="30" x2="180" y2="30" stroke="#38BDF8" stroke-width="2" />
      <circle cx="194" cy="30" r="14" fill="#0284C7" />
      <text x="194" y="34" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SW1</text>
      <line x1="208" y1="30" x2="350" y2="30" stroke="#38BDF8" stroke-width="2" />
      <circle cx="364" cy="30" r="14" fill="#10B981" />
      <text x="364" y="34" font-family="monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">SOC</text>
      <text x="480" y="35" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8">LIVE LAB SIMULATION</text>
    </g>
  </g>
</svg>

